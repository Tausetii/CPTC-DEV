<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCS Login — Wormhole Resort & Casino</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0c0c10;
    --panel:  #141417;
    --border: #2a1545;
    --neon:   #9146ff;
    --dim:    #5a3a78;
    --text:   #e0d0f8;
    --red:    #ff4466;
  }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text); overflow: hidden; position: relative;
  }
  body::after {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    pointer-events: none; z-index: 9999;
  }

  .stars {
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 75%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 50%, rgba(255,255,255,0.4) 0%, transparent 100%);
    pointer-events: none; z-index: 0;
  }

  .login-wrap {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    width: 100%; max-width: 440px; padding: 0 16px;
  }

  .resort-logo { text-align: center; }
  .resort-logo .logo-title { font-size: 11px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; }
  .resort-logo .logo-name {
    font-size: 20px; letter-spacing: 2px; color: var(--neon);
    text-shadow: 0 0 18px rgba(145,70,255,0.7), 0 0 40px rgba(145,70,255,0.3);
  }

  .card {
    width: 100%; background: var(--panel);
    border: 1px solid var(--border); border-top: 2px solid var(--neon);
    padding: 32px; position: relative;
    box-shadow: 0 0 40px rgba(145,70,255,0.1), inset 0 0 40px rgba(0,0,0,0.5);
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent); opacity: 0.5;
  }

  .card-header { text-align: center; margin-bottom: 28px; }
  .card-header h1 { font-size: 18px; letter-spacing: 3px; color: var(--neon); text-transform: uppercase; }
  .card-header p  { font-size: 11px; color: var(--dim); margin-top: 6px; letter-spacing: 1px; }

  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 10px; letter-spacing: 2px; color: var(--dim);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .field input {
    width: 100%; background: rgba(145,70,255,0.04); border: 1px solid var(--border);
    color: var(--neon); font-family: inherit; font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
  }
  .field input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(145,70,255,0.25); }

  .btn-login {
    width: 100%; background: transparent; border: 1px solid var(--neon); color: var(--neon);
    font-family: inherit; font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    padding: 12px; cursor: pointer; transition: background 0.2s, box-shadow 0.2s; margin-top: 8px;
  }
  .btn-login:hover { background: rgba(145,70,255,0.12); box-shadow: 0 0 20px rgba(145,70,255,0.4); }

  .error-msg {
    background: rgba(255,68,102,0.1); border: 1px solid var(--red); color: var(--red);
    font-size: 12px; padding: 10px 14px; margin-bottom: 18px; letter-spacing: 0.5px;
  }
  .error-msg::before { content: '⚠ '; }

  .sys-info { text-align: center; font-size: 10px; color: var(--dim); letter-spacing: 1px; line-height: 1.8; }
  .sys-info span { color: var(--neon); }

  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>
<body>
<div class="stars"></div>
<div class="login-wrap">

  <div class="resort-logo">
    <div class="logo-title">☆ Wormhole Resort & Casino ☆</div>
    <div class="logo-name">BUBBLE CONTROL SYSTEM</div>
  </div>

  <div class="card">
    <div class="card-header">
      <h1>Operator Login</h1>
      <p>Restricted access — authorised personnel only</p>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="off" autofocus placeholder="Enter username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password">
      </div>
      <button type="submit" class="btn-login">Authenticate</button>
    </form>
  </div>

  <div class="sys-info">
    BCS v3.1.4 &nbsp;|&nbsp; <span>ONLINE</span><span class="blink">█</span><br>
    Wormhole Sector 7 — Low Earth Orbit<br>
    Unauthorised access is a violation of Galactic Code §47-B
  </div>

</div>
</body>
</html>
