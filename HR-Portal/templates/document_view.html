{% extends "base.html" %}
{% block title %}{{ filename }}{% endblock %}
{% block content %}

<div class="card">
    <div class="card-header">
        <span>{{ filename }}</span>
        <a href="{{ url_for('documents') }}" class="btn small secondary">← All documents</a>
    </div>
    <div class="card-body">
        <div class="doc-content">{{ content }}</div>
    </div>
</div>

{% endblock %}
