services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wormhole
      POSTGRES_PASSWORD: supernova
      POSTGRES_DB: wormhole
    volumes:
      - casino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wormhole -d wormhole"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to host — only the app talks to it.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://wormhole:supernova@db:5432/wormhole?schema=public"
      JWT_KEY_DIR: "/app/keys"
      JWT_DEFAULT_KID: "primary"
      GEMINI_PROXY_URL: "${GEMINI_PROXY_URL:-}"
      GEMINI_PROXY_TOKEN: "${GEMINI_PROXY_TOKEN:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      PROXY_MACHINE_LABEL: "${PROXY_MACHINE_LABEL:-}"
      ORIGIN: "${ORIGIN:-http://localhost:6767}"
      NODE_ENV: "production"
      PORT: "6767"
      HOST: "0.0.0.0"
    ports:
      - "6767:6767"
    volumes:
      - casino_keys:/app/keys

volumes:
  casino_pgdata:
  casino_keys:
