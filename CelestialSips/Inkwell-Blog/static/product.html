<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product — Celestial Sips</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/main.js" defer></script>
    <script src="/static/js/product.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo">Celestial Sips<span>Blog &amp; Brew</span></a>
        <nav class="main-nav sans">
            <a href="/" data-nav>Home</a>
            <a href="/blog" data-nav>Blog</a>
            <a href="/shop" data-nav>Shop</a>
            <a href="/cart" data-nav>Cart <span class="cart-badge" id="cart-count">0</span></a>
            <a href="/about" data-nav>About</a>
        </nav>
        <div class="auth-links" id="auth-nav"></div>
    </div>
</header>

<main class="container">
    <div class="grid-2">
        <div>
            <div class="product-img" style="height: 260px; border-radius: var(--radius); font-size: 72px;">☕</div>
        </div>
        <div>
            <h1 id="product-name">Loading…</h1>
            <div class="price" id="product-price" style="font-size: 28px; margin: 8px 0 16px;"></div>
            <p id="product-desc"></p>
            <p class="sans muted" id="product-stock" style="font-size: 14px;"></p>
            <div class="shop-actions">
                <input id="product-qty" class="cart-qty" type="number" min="1" max="10" value="1">
                <button class="btn btn-primary sans" id="product-add-cart" type="button">Add to cart</button>
            </div>
        </div>
    </div>

    <section style="margin-top: 40px;">
        <h2>Customer reviews</h2>
        <div id="review-message" class="flash" hidden></div>

        <div class="card" style="margin: 20px 0;">
            <div class="card-body" id="reviews-list">
                <p class="sans muted">Loading reviews…</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h3 class="sans">Write a review</h3>
                <form id="review-form">
                    <div class="field">
                        <label for="review-author">Your name</label>
                        <input id="review-author" name="author" placeholder="Anonymous">
                    </div>
                    <div class="field">
                        <label for="review-rating">Rating</label>
                        <select id="review-rating" name="rating">
                            <option value="5">5 stars</option>
                            <option value="4">4 stars</option>
                            <option value="3">3 stars</option>
                            <option value="2">2 stars</option>
                            <option value="1">1 star</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="review-body">Review</label>
                        <textarea id="review-body" name="body" required placeholder="Tell us what you think…"></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">Post review</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer">© Celestial Sips</footer>
</body>
</html>
