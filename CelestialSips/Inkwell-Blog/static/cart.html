<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart � Celestial Sips</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/main.js" defer></script>
    <script src="/static/js/cart.js" defer></script>
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo">Celestial Sips<span>Blog &amp; Brew</span></a>
        <nav class="main-nav sans">
            <a href="/" data-nav>Home</a>
            <a href="/blog" data-nav>Blog</a>
            <a href="/shop" data-nav>Shop</a>
            <a href="/cart" data-nav>Cart <span class="cart-badge" id="cart-count">0</span></a>
            <a href="/about" data-nav>About</a>
        </nav>
        <div class="auth-links" id="auth-nav"></div>
    </div>
</header>

<main class="container">
    <h1>Your cart</h1>
    <div id="cart-flash" class="flash" hidden></div>
    <div class="cart-layout">
        <section class="card">
            <div class="card-body" id="cart-items">
                <p class="sans muted">Your cart is empty.</p>
            </div>
        </section>

        <aside class="card">
            <div class="card-body">
                <h3 class="sans">Order summary</h3>
                <div class="cart-summary-row"><span>Items</span><strong id="cart-item-count">0</strong></div>
                <div class="cart-summary-row"><span>Total</span><strong id="cart-total">$0.00</strong></div>
                <a class="btn btn-primary" id="checkout-link" href="/checkout" style="width: 100%; text-align: center; margin-top: 12px;">Proceed to checkout</a>
            </div>
        </aside>
    </div>
</main>

<footer class="site-footer">� Celestial Sips</footer>
</body>
</html>
