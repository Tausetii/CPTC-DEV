<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Wormhole TOC :: Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gotham.css') }}">
</head>
<body class="scroll-y">
    <div class="classification">// SECRET // NOFORN // WORMHOLE COMMAND EYES ONLY //</div>
    <div class="login-shell">
        <div class="login-card">
            <div class="login-card-head">
                <div class="ttl">// Authentication</div>
                <div class="num">NODE WHR-CMD-01</div>
            </div>
            <div class="login-card-body">
                <div class="warn-banner">
                    Unauthorized access prohibited under WHR Charter §7-12. <br>
                    All activity logged and routed to OMEGA OVERSIGHT.
                </div>
                {% if error %}
                    <div class="error-banner">{{ error }}</div>
                {% endif %}
                <form method="post" autocomplete="off">
                    <div class="field">
                        <label for="username">// Operator Callsign</label>
                        <input type="text" id="username" name="username" autofocus>
                    </div>
                    <div class="field">
                        <label for="password">// Clearance Phrase</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <button class="btn full armed" type="submit">&gt;&gt; Engage Console</button>
                </form>
            </div>
            <div class="login-foot">
                <span>Build 2049.05.17</span>
                <span>Sector 7G</span>
            </div>
        </div>
    </div>
</body>
</html>
